schemaVersion: "1"
kind: mixin
name: vibekit
displayName: vibekit
description: OpenCode preloaded with config and skills
network:
  allowedDomains:
    - cdn.playwright.dev
    - playwright.download.prss.microsoft.com
    - cdn.playwright.dev
commands:
  install:
    - command: "apt-get update && apt-get install -y --no-install-recommends
        libasound2t64
        libatk-bridge2.0-0t64
        libatk1.0-0t64
        libatspi2.0-0t64
        libatomic1
        libavcodec60
        libavif16
        libcairo-gobject2
        libcairo2
        libcups2t64
        libdbus-1-3
        libdrm2
        libenchant-2-2
        libepoxy0
        libevent-2.1-7t64
        libflite1
        libfontconfig1
        libfreetype6
        libgbm1
        libgdk-pixbuf-2.0-0
        libgles2
        libglib2.0-0t64
        libgstreamer-gl1.0-0
        libgstreamer-plugins-bad1.0-0
        libgstreamer-plugins-base1.0-0
        libgstreamer1.0-0
        libgtk-3-0t64
        libgtk-4-1
        libharfbuzz-icu0
        libharfbuzz0b
        libhyphen0
        libicu74
        libjpeg-turbo8
        liblcms2-2
        libmanette-0.2-0
        libnspr4
        libnss3
        libopus0
        libpango-1.0-0
        libpangocairo-1.0-0
        libpng16-16t64
        libsecret-1-0
        libvpx9
        libwayland-client0
        libwayland-egl1
        libwayland-server0
        libwebp7
        libwebpdemux2
        libwoff1
        libx11-6
        libx11-xcb1
        libx264-164
        libxcb-shm0
        libxcb1
        libxcomposite1
        libxcursor1
        libxdamage1
        libxext6
        libxfixes3
        libxi6
        libxkbcommon0
        libxml2
        libxrandr2
        libxrender1
        libxslt1.1
        gstreamer1.0-libav
        gstreamer1.0-plugins-bad
        gstreamer1.0-plugins-base
        gstreamer1.0-plugins-good"
    - command: "npm -g install playwright"
    - command: "playwright install chromium firefox webkit"
  startup:
    - command: ["sh", "-c", "cp -f \"$HOME/.claude/settings.json.bak\" \"$HOME/.claude/settings.json\""]
