schemaVersion: "1"
kind: mixin
name: vibekit
displayName: vibekit
description: Sandbox preloaded with config and skills
network:
  allowedDomains:
    - cdn.playwright.dev
    - playwright.download.prss.microsoft.com
    - cdn.playwright.dev
commands:
  startup:
    - command: ["sh", "-c", "cp -f \"$HOME/.claude/settings.json.bak\" \"$HOME/.claude/settings.json\""]
